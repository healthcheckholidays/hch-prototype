name: Supabase keepalive

# Supabase pauses free-tier projects after 7 days with no database activity.
# This pings the REST API on a schedule well inside that window so the
# "hch-platform" project (ref bquyjwhbixvskglcfzkh) never gets auto-paused.
on:
  schedule:
    - cron: "0 3 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query hospitals table to register DB activity
        run: |
          curl -sf "${{ secrets.SUPABASE_URL }}/rest/v1/hospitals?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
